    />
    <rect x="185" y="286" width="65" height="42" rx="7" fill="#c95851" />
    <text x="179" y="222" font-size="23" font-weight="700">Human pickers</text>
    <text x="179" y="405" font-size="19">Harvest and request trays</text>
    <rect x="386" y="210" width="230" height="194" rx="20" fill="#fff" stroke="#b4c9a8" stroke-width="2" />
    <text x="501" y="249" font-size="22" font-weight="700">Predictive scheduler</text>
    <text x="501" y="291" font-size="20">Assign transport tasks</text>
    <text x="501" y="325" font-size="20">Adapt to picker delays</text>
    <text x="501" y="359" font-size="20">Coordinate robot teams</text>
    <rect x="708" y="192" width="230" height="224" rx="20" fill="#fff" stroke="#b4c9a8" stroke-width="2" />
    <text x="823" y="226" font-size="23" font-weight="700">Quadruped robots</text>
