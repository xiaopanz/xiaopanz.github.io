<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">Robot-assisted strawberry harvesting</title>
  <desc id="desc">
    A paper-inspired overview: human pickers request tray transport, predictive scheduling assigns quadruped robots, and robots deliver crops to a
    collection station.
  </desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#426f55" /></marker>
  </defs>
  <rect width="1000" height="620" fill="#f8faf6" />
  <g fill="#e4eddc">
    <rect x="38" y="130" width="924" height="50" rx="25" />
    <rect x="38" y="290" width="924" height="50" rx="25" />
    <rect x="38" y="450" width="924" height="50" rx="25" />
  </g>
  <g font-family="Arial, sans-serif" fill="#233b2a" text-anchor="middle">
    <text x="500" y="62" font-size="34" font-weight="700">Robot-assisted strawberry harvesting</text>
    <text x="500" y="100" font-size="22">Human pickers · predictive scheduling · quadruped transport</text>
    <rect x="64" y="192" width="230" height="224" rx="20" fill="#fff" stroke="#b4c9a8" stroke-width="2" />
    <circle cx="135" cy="256" r="24" fill="#c95851" />
    <path
      d="M111 285L95 345M159 285L174 345M135 280V353M135 351L115 382M135 351L155 382"
