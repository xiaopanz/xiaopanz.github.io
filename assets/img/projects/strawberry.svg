      stroke="#426f55"
      stroke-width="11"
      stroke-linecap="round"
    />
    <text x="823" y="405" font-size="19">Transport harvested crops</text>
    <text x="500" y="552" font-size="24" font-weight="700">Collection station</text>
    <text x="500" y="587" font-size="20">Return empty trays · reduce non-picking time</text>
