name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          lycheeVersion: v0.24.2
          # Check external links in personal content; theme docs and demo posts are not published.
          # The companion site check validates internal links after Liquid is rendered.
          # Google Scholar rate-limits automated requests; keep its link for visitors.
          args: >-
            --exclude '^file://'
            --exclude '^https://scholar\.google\.com/'
            --exclude-path _pages/404.md
            --exclude-path _pages/dropdown.md
            --max-concurrency 8 --max-retries 2 --timeout 30
            --verbose --no-progress './_pages/*.md' './_news/*.md'
      - name: Annotate failed links
        if: failure()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          report = Path("lychee/out.md")
          if report.exists():
              for line in report.read_text().splitlines():
                  if line.startswith(("* [", "- [")):
                      message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                      print(f"::error title=Broken link::{message}")
          PY
      - name: Upload link report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-link-report
          path: lychee/out.md
          if-no-files-found: ignore
